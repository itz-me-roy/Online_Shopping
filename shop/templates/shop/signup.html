{% extends "base.html" %}
{% block title %}Sign up · Shop{% endblock %}

{% block content %}
<h1>Create an account</h1>
<form method="post" class="checkout-form">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn">Sign up</button>
</form>
<p>Already have an account? <a href="{% url 'shop:login' %}">Log in</a></p>
{% endblock %}
